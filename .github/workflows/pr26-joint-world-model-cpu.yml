name: PR26 joint V4 plus pgmpy transport world model CPU

on:
  push:
    branches: [feature/rhwm-joint-service-transport-20261112]
    paths: [.github/workflows/pr26-joint-world-model-cpu.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-joint-forecast:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.10"}
      - name: Install frozen CPU environment and published pgmpy
        run: |
          python -m pip install uv==0.13.5
          uv pip install --system --python "$(command -v python)" --index-strategy unsafe-best-match -r requirements-paper-reuse.lock
          uv pip install --system --python "$(command -v python)" -r requirements-rhwm-method-transfer.txt
          uv pip install --system --python "$(command -v python)" -r requirements-rhwm-transport-bayes.txt
      - name: Restore frozen V4 and prior fitted transport CPDs only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr26"
          for row in "13765135588:v4.zip" "13905800894:transport.zip"; do
            id="${row%%:*}"; dest="${row#*:}"
            curl -fsSL --retry 3 -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/lieuyimo/wm/actions/artifacts/$id/zip" \
              -o "$RUNNER_TEMP/pr26/$dest"
          done
          unzip -p "$RUNNER_TEMP/pr26/v4.zip" v4-data.pt > "$RUNNER_TEMP/pr26/v4.pt"
          unzip -p "$RUNNER_TEMP/pr26/transport.zip" pgmpy-model.json > "$RUNNER_TEMP/pr26/transport.json"
          echo "60c8a6c3d832da3e6519072688ea099f64ae120ba19d3bd2ec705f7f1a11ac0c  $RUNNER_TEMP/pr26/v4.pt" | sha256sum -c
          export CHECKPOINT="$RUNNER_TEMP/pr26/v4.pt"
          export TRANSPORT="$RUNNER_TEMP/pr26/transport.json"
          python - <<'PY'
          import json,os
          j=json.load(open(os.environ['TRANSPORT']))
          assert j['train_legs']==240 and j['train_positive']==32
          assert j['schema']=='rhwm-transport-pgmpy-reference-v1'
          PY
          echo "RHWM_V4_CHECKPOINT=$CHECKPOINT" >> "$GITHUB_ENV"
          echo "RHWM_TRANSPORT_JSON=$TRANSPORT" >> "$GITHUB_ENV"
      - name: Validate legal transitions and existing full-state contracts
        run: |
          timeout 150s python -m unittest discover -s experiments/world_model_integration/system_world_model/tests -v 2>&1 | tee "$RUNNER_TEMP/pr26/tests.log"
      - name: Run frozen independent 12-group joint forecasts H1 H5 H10
        run: |
          timeout 240s python -m experiments.world_model_integration.system_world_model.joint_evaluate \
            --checkpoint "$RHWM_V4_CHECKPOINT" \
            --transport "$RHWM_TRANSPORT_JSON" \
            --out "$RUNNER_TEMP/pr26/results.json" 2>&1 | tee "$RUNNER_TEMP/pr26/run.log"
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"pr26"
          r=json.loads((root/"results.json").read_text())
          s=r["summary"]
          assert s["groups"]==12 and s["new_training"]==0 and s["gpu"]==0
          assert s["transport_risk_queries"]>0
          for h,arms in s["by_horizon"].items():
            assert set(arms)=={"rule","v4","joint_shadow","joint_sampled_hold"}
            assert arms["joint_shadow"]["mean"]==arms["v4"]["mean"]
          print("PR26_JOINT_WORLD_MODEL_COMPLETE")
          PY
          (cd "$RUNNER_TEMP/pr26" && sha256sum results.json tests.log run.log > evidence_sha256.txt)
      - name: Archive complete risk and full-system error evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr26-joint-world-model-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pr26/results.json
            ${{ runner.temp }}/pr26/tests.log
            ${{ runner.temp }}/pr26/run.log
            ${{ runner.temp }}/pr26/evidence_sha256.txt
          retention-days: 90
          if-no-files-found: warn
