name: PR33 read only online decision hard budget audit
on:
  push:
    branches: [research/pr33-online-decision-budget-audit-20261112]
    paths: [.github/workflows/pr33-online-decision-budget-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  immutable-pr32-budget-inspection:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Download and hash-validate exact PR32 saved online facts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr33/source"
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/lieuyimo/wm/actions/artifacts/13911157726/zip" \
            -o "$RUNNER_TEMP/pr33/pr32-original.zip"
          unzip -q "$RUNNER_TEMP/pr33/pr32-original.zip" -d "$RUNNER_TEMP/pr33/source"
          (cd "$RUNNER_TEMP/pr33/source" && sha256sum -c evidence_sha256.txt)
      - name: Compute only what already-executed actions recorded
        run: |
          set -euo pipefail
          python -m experiments.world_model_integration.posttraining.pr33_readonly_audit \
            --source "$RUNNER_TEMP/pr33/source/independent-online.json" \
            --out "$RUNNER_TEMP/pr33/audit.json" \
            2>&1 | tee "$RUNNER_TEMP/pr33/audit.log"
          python - <<'PY'
          import os,json,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"pr33"
          r=json.loads((p/"audit.json").read_text())
          s=r["summary"]
          assert s["groups"]==24 and s["gpu"]==0
          assert s["new_simulation"]==0 and s["new_model_inference"]==0
          assert set(s["by_regime"])=={"light","medium","heavy","shift"}
          assert all(g["groups"]==6 for g in s["by_regime"].values())
          assert all(set(g["arms"])=={"cp_sat","rule_h20","original_v4_h20","warmstart_v4_h20","scratch_v4_h20"}
              for g in s["by_regime"].values())
          print("PR33_SOURCE_VERIFIED_BUDGET_AUDIT_PASSED")
          PY
          (cd "$RUNNER_TEMP/pr33" && sha256sum audit.json audit.log > audit_sha256.txt)
      - name: Archive read-only audit and independent checksum
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr33-decision-budget-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pr33/audit.json
            ${{ runner.temp }}/pr33/audit.log
            ${{ runner.temp }}/pr33/audit_sha256.txt
          retention-days: 90
          if-no-files-found: warn
