name: PR43 original online evidence first divergence read only
on:
  push:
    branches: [research/pr43-forecast-utility-transfer-20261112]
    paths: [.github/workflows/pr43-first-divergence-readonly.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  read-only-online-trajectory-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Recover immutable PR43 original 24 scene online artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr43audit/input" "$RUNNER_TEMP/pr43audit/output"
          curl -fsSL --retry 3 -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/lieuyimo/wm/actions/artifacts/13914787519/zip" \
            -o "$RUNNER_TEMP/pr43audit/source.zip"
          unzip -q "$RUNNER_TEMP/pr43audit/source.zip" -d "$RUNNER_TEMP/pr43audit/input"
          (cd "$RUNNER_TEMP/pr43audit/input" && sha256sum -c SHA256SUMS)
          grep -Fx "39a3d57e83a982c2412394a3b8ababf51b3f0c9e" "$RUNNER_TEMP/pr43audit/input/source_head.txt"
      - name: Test audit logic without importing inference/torch
        run: |
          set -euo pipefail
          python -m unittest \
            experiments.world_model_integration.forecast_utility.test_pr43_readonly -v \
            2>&1 | tee "$RUNNER_TEMP/pr43audit/output/tests.log"
      - name: First-divergence audit on existing records, zero new trajectories
        run: |
          set -euo pipefail
          python -m experiments.world_model_integration.forecast_utility.pr43_readonly_audit \
            --source "$RUNNER_TEMP/pr43audit/input/results.json" \
            --out "$RUNNER_TEMP/pr43audit/output/first-divergence.json" \
            2>&1 | tee "$RUNNER_TEMP/pr43audit/output/run.log"
          python - <<'PY'
          import os,json
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"pr43audit/output/first-divergence.json"
          o=json.loads(p.read_text())
          assert o["new_training"]==o["new_simulation"]==o["new_model_inference"]==o["gpu"]==0
          assert len(o["scenario_first_divergences"])==24
          print("PR43_READONLY_NO_NEW_TRAJECTORY_SUCCESS")
          PY
          (cd "$RUNNER_TEMP/pr43audit/output" && sha256sum first-divergence.json run.log tests.log > SHA256SUMS)
          git rev-parse HEAD > "$RUNNER_TEMP/pr43audit/output/audit_source_head.txt"
      - name: Publish read-only report and checksum
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr43-first-divergence-readonly-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pr43audit/output/
          retention-days: 90
          if-no-files-found: warn
