name: PR35 strict post-candidate 0.5s model decision gate on unseen scenes

on:
  push:
    branches: [feature/pr35-strict-h20-budget-fallback-20261112]
    paths: [.github/workflows/pr35-strict-h20-budget-cpu.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  strict-h20-real-online:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.10"}
      - name: Restore original reproducible CPU runtime
        run: |
          set -euo pipefail
          python -m pip install uv==0.13.5
          uv pip install --system --python "$(command -v python)" --index-strategy unsafe-best-match -r requirements-paper-reuse.lock
          python -c "import torch; assert torch.version.cuda is None;torch.set_num_threads(1)"
      - name: Verify immutable original and PR31 validation-selected scratch V4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr35"
          for row in "13765135588:original.zip" "13911001730:posttrain.zip"; do
            id="${row%%:*}"; dest="${row#*:}"
            curl -fsSL --retry 3 -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/lieuyimo/wm/actions/artifacts/$id/zip" \
              -o "$RUNNER_TEMP/pr35/$dest"
          done
          unzip -p "$RUNNER_TEMP/pr35/original.zip" v4-data.pt > "$RUNNER_TEMP/pr35/original.pt"
          unzip -p "$RUNNER_TEMP/pr35/posttrain.zip" trained/scratch_v4-best.pt > "$RUNNER_TEMP/pr35/scratch.pt"
          unzip -p "$RUNNER_TEMP/pr35/posttrain.zip" trained/validation-selection.json > "$RUNNER_TEMP/pr35/selection.json"
          echo "60c8a6c3d832da3e6519072688ea099f64ae120ba19d3bd2ec705f7f1a11ac0c  $RUNNER_TEMP/pr35/original.pt" | sha256sum -c
          python - <<'PY'
          from pathlib import Path
          import os,json,hashlib
          p=Path(os.environ["RUNNER_TEMP"])/"pr35"
          s=json.loads((p/"selection.json").read_text())
          assert s["best_by_validation_brier"]=="scratch_v4"
          assert hashlib.sha256((p/"scratch.pt").read_bytes()).hexdigest()==s["arms"]["scratch_v4"]["files"]["best"]["sha256"]
          print("PR35_PR31_CHECKPOINT_SHA256_VERIFIED")
          PY
          echo "RHWM_V4_ORIGINAL=$RUNNER_TEMP/pr35/original.pt" >> "$GITHUB_ENV"
          echo "RHWM_V4_SCRATCH=$RUNNER_TEMP/pr35/scratch.pt" >> "$GITHUB_ENV"
      - name: Test the precise former bug with an artificial process-time clock
        run: |
          set -euo pipefail
          python -m compileall -q experiments/world_model_integration/strict_budget
          timeout 180s python -m unittest discover \
            -s experiments/world_model_integration/strict_budget -p 'test_*.py' -v \
            2>&1 | tee "$RUNNER_TEMP/pr35/tests.log"
      - name: Execute 24 genuinely independent online scenarios with strict accepted decision budget
        run: |
          set -euo pipefail
          timeout 650s python -m experiments.world_model_integration.strict_budget.pr35_run \
            --original "$RHWM_V4_ORIGINAL" \
            --scratch "$RHWM_V4_SCRATCH" \
            --selection "$RUNNER_TEMP/pr35/selection.json" \
            --out "$RUNNER_TEMP/pr35/strict-online.json" \
            2>&1 | tee "$RUNNER_TEMP/pr35/run.log"
          python - <<'PY'
          from pathlib import Path
          import json,os
          p=Path(os.environ["RUNNER_TEMP"])/"pr35"
          r=json.loads((p/"strict-online.json").read_text())
          s=r["summary"]
          assert s["independent_groups"]==24 and s["gpu"]==0 and s["new_training"]==0
          assert s["accepted_over_budget_nondefault_actions"]==0
          assert set(s["by_regime"])=={"light","medium","heavy","shift"}
          assert all(v["groups"]==6 for v in s["by_regime"].values())
          assert all(all(a["completed"]==6 and a["safety_violations"]==0 and
                         a["model_changes_after_cpu_cap"]==0
                         for a in v["arms"].values())
                     for v in s["by_regime"].values())
          print("PR35_SAFE_ACCEPTANCE_GATE_PROVED_ON_24_NEW_SCENES")
          PY
          (cd "$RUNNER_TEMP/pr35" && sha256sum strict-online.json run.log tests.log selection.json > SHA256SUMS)
      - name: Retain full scenario action log, results and selection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr35-strict-h20-online-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pr35/strict-online.json
            ${{ runner.temp }}/pr35/run.log
            ${{ runner.temp }}/pr35/tests.log
            ${{ runner.temp }}/pr35/selection.json
            ${{ runner.temp }}/pr35/SHA256SUMS
          retention-days: 90
          if-no-files-found: warn
