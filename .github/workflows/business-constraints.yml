name: Business capacity and staged transport CPU

on:
  pull_request:
    paths:
      - 'business_transport/**'
      - 'experiments/business_constraints/**'
      - 'tools/business_constraints/**'
      - 'examples/evidence/business-capacity-20261109/**'
      - 'examples/evidence/business-capacity-independent-rng-20261109/**'
      - 'lab_transport/**'
      - 'tests/**'
      - '.github/workflows/business-constraints.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capacity-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install the unchanged pinned CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'uv==0.13.5'
          uv pip install --system --python "$(command -v python)" --index-strategy unsafe-best-match -r requirements-paper-reuse.lock
          python -c "import torch; assert torch.version.cuda is None; print('CPU PyTorch', torch.__version__)"
      - name: Verify historical and current evidence
        shell: bash
        run: |
          set -euo pipefail
          for path in examples/evidence/pr8-a100-baseline-20261109 examples/evidence/service-dynamics-20261109 examples/evidence/service-decision-value-20261109 examples/evidence/paper-reuse-integration-20261109 examples/evidence/business-capacity-20261109 examples/evidence/business-capacity-independent-rng-20261109; do
            (cd "$path" && sha256sum -c SHA256SUMS)
          done
      - name: Run prior and new regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python -m unittest discover -s experiments/service_value/tests -v
          python -m unittest discover -s experiments/paper_reuse/tests -v
          python -m unittest discover -s experiments/business_constraints/tests -v
      - name: Reproduce paired development and confirmation without model training
        shell: bash
        run: |
          set -euo pipefail
          timeout 1100s bash tools/business_constraints/run_cpu.sh "$RUNNER_TEMP/business-constraints" 2>&1 | tee "$RUNNER_TEMP/business-constraints.log"
      - name: Preserve experimental output and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-constraints-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/business-constraints.log
            ${{ runner.temp }}/business-constraints/
          if-no-files-found: warn
          retention-days: 14
