name: PR46 original online first divergence read only audit
on:
  push:
    branches: [research/pr46-recovery-mechanism-shift-online-20261112]
    paths:
      - .github/workflows/pr46-readonly-first-divergence.yml
      - experiments/world_model_integration/pr46_evidence_audit/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  archived-online-first-divergence:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Restore ORIGINAL 72-episode results and verify original artifact hashes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr46audit/source" "$RUNNER_TEMP/pr46audit/report"
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/lieuyimo/wm/actions/artifacts/13916703445/zip \
            -o "$RUNNER_TEMP/pr46audit/original.zip"
          unzip -q "$RUNNER_TEMP/pr46audit/original.zip" -d "$RUNNER_TEMP/pr46audit/source"
          (cd "$RUNNER_TEMP/pr46audit/source" && sha256sum -c SHA256SUMS)
          grep -Fx "478045faacf4a76d009ff05718fef2cb2af9f53a" "$RUNNER_TEMP/pr46audit/source/source_head.txt"
      - name: Standard library contract tests (no model import)
        run: |
          set -euo pipefail
          python -m unittest experiments.world_model_integration.pr46_evidence_audit.test_pr46_readonly -v \
            2>&1 | tee "$RUNNER_TEMP/pr46audit/report/tests.log"
      - name: First common-prefix online action divergence analysis, NO new simulation
        run: |
          set -euo pipefail
          python -m experiments.world_model_integration.pr46_evidence_audit.pr46_first_divergence \
            --source "$RUNNER_TEMP/pr46audit/source/online.json" \
            --out "$RUNNER_TEMP/pr46audit/report/first-divergence.json" \
            2>&1 | tee "$RUNNER_TEMP/pr46audit/report/run.log"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"pr46audit/report/first-divergence.json"
          r=json.loads(p.read_text())
          assert len(r["cases"])==24
          assert r["gpu"]==r["new_training"]==r["new_model_calls"]==r["new_simulations"]==0
          assert set(r["summary"])=={"within_support","extended_outage"}
          for mechanism,summary in r["summary"].items():
              print("PR46_FIRST_DIVERGENCE",mechanism,json.dumps(summary,ensure_ascii=False))
          print("PR46_READONLY_COMPLETED")
          PY
          git rev-parse HEAD > "$RUNNER_TEMP/pr46audit/report/audit_head.txt"
          (cd "$RUNNER_TEMP/pr46audit/report" && sha256sum tests.log run.log first-divergence.json audit_head.txt > SHA256SUMS)
      - name: Archive transparent first-divergence results and checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr46-first-divergence-readonly-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pr46audit/report/
          retention-days: 90
          if-no-files-found: warn
