name: PR28 literature-grounded dynamic decision identifiability CPU
# Run the frozen workload with corrected initial public-observation field references.

on:
  push:
    branches: [research/pr28-dynamic-decision-identifiability-20261112]
    paths: [.github/workflows/pr28-dynamic-action-value-cpu.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  dynamic-action-value:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install pinned existing CPU dependencies, no new learned method
        run: |
          set -euo pipefail
          python -m pip install uv==0.13.5
          uv pip install --system --python "$(command -v python)" --index-strategy unsafe-best-match -r requirements-paper-reuse.lock
          uv pip install --system --python "$(command -v python)" -r requirements-rhwm-method-transfer.txt
          uv pip install --system --python "$(command -v python)" -r requirements-rhwm-transport-bayes.txt
          python - <<'PY'
          import torch
          assert torch.version.cuda is None
          torch.set_num_threads(1)
          PY
      - name: Restore immutable V4 published prior artifact and validate hash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr28"
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/lieuyimo/wm/actions/artifacts/13765135588/zip" \
            -o "$RUNNER_TEMP/pr28/model.zip"
          unzip -p "$RUNNER_TEMP/pr28/model.zip" v4-data.pt > "$RUNNER_TEMP/pr28/frozen-v4.pt"
          echo "60c8a6c3d832da3e6519072688ea099f64ae120ba19d3bd2ec705f7f1a11ac0c  $RUNNER_TEMP/pr28/frozen-v4.pt" | sha256sum -c
          echo "RHWM_V4_CHECKPOINT=$RUNNER_TEMP/pr28/frozen-v4.pt" >> "$GITHUB_ENV"
      - name: Verify frozen protocol and original action/business safety
        run: |
          set -euo pipefail
          python -m compileall -q experiments/world_model_integration/dynamic_identifiability
          timeout 150s python -m unittest discover \
            -s experiments/world_model_integration/dynamic_identifiability -p 'test_*.py' -v \
            2>&1 | tee "$RUNNER_TEMP/pr28/tests.log"
      - name: One-shot 12 independent synthetic groups, both factual branches, frozen V4 prediction
        run: |
          set -euo pipefail
          timeout 600s python -m experiments.world_model_integration.dynamic_identifiability.pr28_experiment \
            --checkpoint "$RHWM_V4_CHECKPOINT" \
            --out "$RUNNER_TEMP/pr28/result.json" --cpu-budget 360 \
            2>&1 | tee "$RUNNER_TEMP/pr28/run.log"
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"pr28"
          x=json.loads((root/"result.json").read_text())
          s=x["summary"]
          assert s["groups"]==12 and s["gpu"]==0 and s["training"]==0
          assert set(s["by_regime"])=={"simultaneous_load","scheduled_release"}
          assert sum(g["groups"] for g in s["by_regime"].values())==12
          assert all(g["first_outcome"]["safety_violations"]==0 for g in x["groups"])
          assert all(g["second_outcome"] is None or
                     g["second_outcome"]["safety_violations"]==0 for g in x["groups"])
          assert s["factual_runs"]>=12
          print("PR28_DYNAMIC_ACTION_IDENTIFIABILITY_COMPLETE",{
              "groups":s["groups"],
              "both_plans_tested":s["both_plans_tested"],
              "factual_runs":s["factual_runs"],
          })
          PY
          (cd "$RUNNER_TEMP/pr28" && sha256sum result.json run.log tests.log > evidence_sha256.txt)
      - name: Preserve complete paired truth, prospective predictions, tests and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr28-dynamic-action-value-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pr28/result.json
            ${{ runner.temp }}/pr28/run.log
            ${{ runner.temp }}/pr28/tests.log
            ${{ runner.temp }}/pr28/evidence_sha256.txt
          retention-days: 90
          if-no-files-found: warn
