name: PR68 original PR61 A100 checkpoint CPU admission gate
on:
  push:
    branches: [research/pr68-original-pr61-checkpoint-cpu-evaluation-gate-20261113]
    paths:
      - .github/workflows/pr68-original-pr61-checkpoint-admission-cpu.yml
      - experiments/world_model_integration/recovery_pr68/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-verified-checkpoint-blocker:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install unchanged original PyG CPU world model environment
        run: |
          set -euo pipefail
          python -m pip install 'uv==0.13.5'
          uv pip install --system --python "$(command -v python)" --index-strategy unsafe-best-match -r requirements-paper-reuse.lock
          python -m pip install 'torch-geometric==2.6.1'
          python - <<'PY'
          import torch
          assert torch.version.cuda is None
          print("PR68_NO_GPU_NO_TRAINING", torch.__version__)
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: 43234653164
          github-token: ${{ github.token }}
          name: pr59-real-public-world-43234653164-validation
          path: ${{ runner.temp }}/original-pr59-validation
      - uses: actions/download-artifact@v4
        with:
          run-id: 43264954353
          github-token: ${{ github.token }}
          name: pr64-real-random-outage-43264954353-train
          path: ${{ runner.temp }}/original-pr64-train
      - uses: actions/download-artifact@v4
        with:
          run-id: 43264954353
          github-token: ${{ github.token }}
          name: pr64-real-random-outage-43264954353-validation
          path: ${{ runner.temp }}/original-pr64-dev
      - uses: actions/download-artifact@v4
        with:
          run-id: 43264954353
          github-token: ${{ github.token }}
          name: pr64-shifted-outage-true-risk-set-audit-43264954353
          path: ${{ runner.temp }}/original-pr64-quality
      - name: Verify ORIGINAL immutable PR59 and PR64 sources and checkpoints entrypoint
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr68"
          (cd "$RUNNER_TEMP/original-pr59-validation" && sha256sum -c SHA256SUMS)
          (cd "$RUNNER_TEMP/original-pr64-train" && sha256sum -c SHA256SUMS)
          (cd "$RUNNER_TEMP/original-pr64-dev" && sha256sum -c SHA256SUMS)
          (cd "$RUNNER_TEMP/original-pr64-quality" && sha256sum -c SHA256SUMS)
          python -m compileall -q experiments/world_model_integration/recovery_pr68
          python -m unittest \
            experiments.world_model_integration.recovery_pr68.test_pr68 \
            experiments.world_model_integration.stochastic_pr66.test_pr66 \
            experiments.world_model_integration.neural_pr67.test_pr67 -v \
            2>&1 | tee "$RUNNER_TEMP/pr68/tests.log"
          python -m experiments.world_model_integration.recovery_pr68.pr68_cpu_eval --help \
            | tee "$RUNNER_TEMP/pr68/eval-help.log"
      - name: Explicitly record absent controlled LOCAL A100 checkpoint, never fake inference
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          from experiments.world_model_integration.recovery_pr68.pr68_checkpoint import (
            ARCHIVE_BYTES, ARCHIVE_SHA256, ORIGINAL_VAL_SHA256, sha256_file,
            read_manifest, ORIGINAL_MODEL_HEAD)
          from experiments.world_model_integration.sealed_pr59.pr59_gpu_train import load_actual_source
          root=Path(os.environ["RUNNER_TEMP"])
          val=root/"original-pr59-validation/data.json"
          if sha256_file(val)!=ORIGINAL_VAL_SHA256:
              raise AssertionError("original PR61 selection validation data SHA mismatch")
          episodes,source_sha=load_actual_source([val],"validation")
          if len(episodes)!=12 or sum(len(x["graphs"]) for x in episodes)!=1517:
              raise AssertionError("source mismatches PR61 original one-step counts")
          manifest=Path("examples/evidence/pr60-gpu-training-20261112/checkpoint_manifest.csv")
          assert len(read_manifest(manifest))==6
          fake=root/"pr60-gpu-checkpoints-20261112.tar.gz"
          assert not fake.exists(), "controlled original local archive unexpectedly inserted"
          report={
              "schema":"pr68-original-pr61-checkpoint-access-preflight-v1",
              "status":"BLOCKED_IN_CI_ORIGINAL_PR61_ARCHIVE_NOT_SUPPLIED",
              "meaning":"CPU code and input datasets admitted, no trained PR61 weights in GitHub Actions environment",
              "expected_original_archive_bytes":ARCHIVE_BYTES,
              "expected_original_archive_sha256":ARCHIVE_SHA256,
              "original_gpu_train_head":ORIGINAL_MODEL_HEAD,
              "original_validation_sha256":ORIGINAL_VAL_SHA256,
              "original_val_scenes":len(episodes),
              "original_val_true_steps":sum(len(x["graphs"]) for x in episodes),
              "manifest_sha256":sha256_file(manifest),
              "pr64_train_sha256":sha256_file(root/"original-pr64-train/data.json"),
              "pr64_dev_sha256":sha256_file(root/"original-pr64-dev/data.json"),
              "original_checkpoint_loaded":False,
              "new_training":False,"gpu_used":False,
              "original_BLIND_read":False,
              "run_head":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
          }
          (root/"pr68/preflight.json").write_text(json.dumps(report,indent=2)+"\n")
          print("PR68_ORIGINAL_PR61_MISSING_CHECKPOINT_EXPLICIT_BLOCK",json.dumps(report),flush=True)
          PY
          git rev-parse HEAD > "$RUNNER_TEMP/pr68/source_head.txt"
          python -m pip freeze > "$RUNNER_TEMP/pr68/pip-freeze.txt"
          (cd "$RUNNER_TEMP/pr68" && sha256sum tests.log eval-help.log preflight.json source_head.txt pip-freeze.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr68-original-checkpoint-source-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/pr68/
          retention-days: 90
          if-no-files-found: warn
