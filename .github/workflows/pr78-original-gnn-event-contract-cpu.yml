name: PR78 original PR61 RGCN SAGE public service information and event head CPU gate
on:
  push:
    branches: [research/pr78-original-gnn-public-service-event-alignment-20261114]
    paths:
      - .github/workflows/pr78-original-gnn-event-contract-cpu.yml
      - experiments/world_model_integration/gnn_pr78/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-relational-gnn-event:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install original repository CPU dependencies
        run: |
          set -euo pipefail
          python -m pip install 'uv==0.13.5'
          uv pip install --system --python "$(command -v python)" --index-strategy unsafe-best-match -r requirements-paper-reuse.lock
          python -m pip install 'torch-geometric==2.6.1'
          python - <<'PY'
          import torch
          assert torch.version.cuda is None
          print("PR78_CPU_ORIGINAL_PR61_GRAPH_ONLY",torch.__version__)
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: 43264954353
          github-token: ${{ github.token }}
          name: pr64-real-random-outage-43264954353-train
          path: ${{ runner.temp }}/original-train
      - uses: actions/download-artifact@v4
        with:
          run-id: 43264954353
          github-token: ${{ github.token }}
          name: pr64-real-random-outage-43264954353-validation
          path: ${{ runner.temp }}/original-dev
      - uses: actions/download-artifact@v4
        with:
          run-id: 43264954353
          github-token: ${{ github.token }}
          name: pr64-shifted-outage-true-risk-set-audit-43264954353
          path: ${{ runner.temp }}/original-quality
      - name: Actual public service info, factual next-event target, and whole-GNN map gradient gates
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr78"
          python -m compileall -q experiments/world_model_integration/gnn_pr78
          python -m unittest \
            experiments.world_model_integration.gnn_pr78.test_pr78 \
            experiments.world_model_integration.identifiability_pr72.test_pr72 \
            experiments.world_model_integration.sealed_pr59.test_pr59 \
            experiments.world_model_integration.neural_pr67.test_pr67 -v \
            2>&1 | tee "$RUNNER_TEMP/pr78/tests.log"
          python - <<'PY' | tee "$RUNNER_TEMP/pr78/architecture.json"
          import json
          from experiments.world_model_integration.gnn_pr78.pr78_model import (
              PublicMapRelationalServiceWorld, SOURCE_SCHEMA,
          )
          from business_transport.session_events import QUERY_WIDTH
          a=PublicMapRelationalServiceWorld(hidden=48,map_enabled=True)
          b=PublicMapRelationalServiceWorld(hidden=48,map_enabled=False)
          assert a.graph_world.state_dict().keys()==b.graph_world.state_dict().keys()
          assert a.original_pr61_parameters()==52953
          assert a.original_pr61_parameters()==b.original_pr61_parameters()
          print(json.dumps({
              "schema":SOURCE_SCHEMA,
              "actual_original_PR61_RGCN_SAGEConv_backbone_parameters":a.original_pr61_parameters(),
              "conditional_public_service_query_width":QUERY_WIDTH,
              "additional_event_head_parameters":a.service_head_parameters(),
              "architecture_parameter_matched_map_on_off":(
                  sum(p.numel() for p in a.parameters())==sum(p.numel() for p in b.parameters())),
              "true_new_GNN_training_completed":False,
              "original_PR61_checkpoint_loaded":False,
              "real_business_public_service_input_and_gradient_gate":True,
              "no_BLIND":True,"no_GPU":True
          },sort_keys=True))
          PY
          (cd "$RUNNER_TEMP/original-train" && sha256sum -c SHA256SUMS)
          (cd "$RUNNER_TEMP/original-dev" && sha256sum -c SHA256SUMS)
          (cd "$RUNNER_TEMP/original-quality" && sha256sum -c SHA256SUMS)
          python -m experiments.world_model_integration.gnn_pr78.pr78_smoke \
            --train "$RUNNER_TEMP/original-train/data.json" \
            --dev "$RUNNER_TEMP/original-dev/data.json" \
            --quality "$RUNNER_TEMP/original-quality/quality.json" \
            --max-per-public-phase 8 \
            --out "$RUNNER_TEMP/pr78/real_j2_graph_event_smoke.json" \
            2>&1 | tee "$RUNNER_TEMP/pr78/real_j2_graph_event_smoke.log"
          python - <<'PY'
          import os,json
          from pathlib import Path
          q=Path(os.environ["RUNNER_TEMP"])/"pr78/real_j2_graph_event_smoke.json"
          v=json.loads(q.read_text())
          assert not v["original_PR61_training_weights_loaded"] and v["no_TEST_or_BLIND"]
          assert len(v["scenes"]["train"])==3
          assert len(v["scenes"]["developer_validation"])==3
          assert v["arm"]["map_on"]["original_backbone_parameters"]==52953
          assert v["arm"]["map_off"]["original_backbone_parameters"]==52953
          assert all(z["optimizer_updates"]>0 for z in v["arm"].values())
          print("PR78_REAL_FROZEN_PR64_J2_PUBLIC_GNN_EVENT_TARGET_GRADIENT_GATE_PASS")
          PY
          python -m experiments.world_model_integration.gnn_pr78.pr78_data_gate \
            --train "$RUNNER_TEMP/original-train/data.json" \
            --dev "$RUNNER_TEMP/original-dev/data.json" \
            --quality "$RUNNER_TEMP/original-quality/quality.json" \
            --out "$RUNNER_TEMP/pr78/all_j2_original_graph_service_labels.json" \
            2>&1 | tee "$RUNNER_TEMP/pr78/all_j2_original_graph_service_labels.log"
          python - <<'PY'
          import os,json
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"pr78/all_j2_original_graph_service_labels.json").read_text())
          assert r["full_original_source"]["train"]["by_phase_and_event"]["eligible_risks"]==2593
          assert r["full_original_source"]["developer_validation"]["by_phase_and_event"]["eligible_risks"]==1409
          assert not r["model_training_or_Brier_claim"] and not r["BLIND_TEST_read"]
          print("PR78_ALL_24_TRAIN_12_DEV_GRAPH_SOURCE_REAL_EVENT_LABELS_PASS")
          PY
          git rev-parse HEAD > "$RUNNER_TEMP/pr78/source_head.txt"
          python -m pip freeze > "$RUNNER_TEMP/pr78/pip-freeze.txt"
          (cd "$RUNNER_TEMP/pr78" && sha256sum tests.log architecture.json real_j2_graph_event_smoke.json real_j2_graph_event_smoke.log all_j2_original_graph_service_labels.json all_j2_original_graph_service_labels.log source_head.txt pip-freeze.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr78-original-gnn-public-event-cpu-${{ github.run_id }}
          path: ${{ runner.temp }}/pr78/
          retention-days: 90
          if-no-files-found: warn
