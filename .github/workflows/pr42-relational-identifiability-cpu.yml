name: PR42 frozen V4 relational identifiability CPU-only audit
on:
  push:
    branches: [research/relational-identifiability-20261112]
    paths: [.github/workflows/pr42-relational-identifiability-cpu.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pr42-relations:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Restore frozen PR31 CPU dependency environment
        run: |
          set -euo pipefail
          python -m pip install 'uv==0.13.5'
          uv pip install --system --python "$(command -v python)" --index-strategy unsafe-best-match -r requirements-paper-reuse.lock
          python - <<'PY'
          import torch
          assert torch.version.cuda is None, "GPU not authorized"
          torch.set_num_threads(1)
          print("PR42_CPU",torch.__version__)
          PY
      - name: Restore exact historical V4 checkpoint with hash gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr42"
          curl -fsSL --retry 3 -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/lieuyimo/wm/actions/artifacts/13765135588/zip \
            -o "$RUNNER_TEMP/pr42/original.zip"
          unzip -p "$RUNNER_TEMP/pr42/original.zip" v4-data.pt > "$RUNNER_TEMP/pr42/v4-data.pt"
          echo "60c8a6c3d832da3e6519072688ea099f64ae120ba19d3bd2ec705f7f1a11ac0c  $RUNNER_TEMP/pr42/v4-data.pt" | sha256sum -c
          echo "PR42_V4=$RUNNER_TEMP/pr42/v4-data.pt" >> "$GITHUB_ENV"
      - name: Unit tests and source sanity
        run: |
          set -euo pipefail
          python -m compileall -q experiments/world_model_integration/relational_identifiability
          python -m unittest experiments.world_model_integration.relational_identifiability.test_pr42 -v \
            2>&1 | tee "$RUNNER_TEMP/pr42/tests.log"
      - name: Paired factual and H20 development diagnostic
        run: |
          set -euo pipefail
          timeout 600s python -m experiments.world_model_integration.relational_identifiability.pr42_audit \
            --checkpoint "$PR42_V4" --out "$RUNNER_TEMP/pr42/result.json" \
            2>&1 | tee "$RUNNER_TEMP/pr42/run.log"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"pr42/result.json"
          r=json.loads(p.read_text())
          assert r["evidence_scope"]=="reused_PR30_synthetic_development_not_independent"
          assert r["summary"]["cases"]==8 and r["summary"]["gpu"]==0
          assert r["summary"]["new_training"]==0
          assert all(not a["factual_outcome_offline_only"]["safety_violations"]
                     for g in r["groups"] for a in g["candidates"])
          for g in r["groups"]:
              p=g["representation_comparison"]
              print("PR42_CASE",json.dumps({
                  "id":g["id"],"regime":g["regime"],
                  "raw_relation_diff":p["raw_relationships_different"] if p else None,
                  "token_collision":p["numeric_token_multisets_equal"] if p else None,
                  "context_linf":p["pooled_context_linf"] if p else None,
                  "completed_score_tie":g["candidate_predictions_tied"],
                  "full_state_tie":g["h20_full_state_distribution_tied"],
                  "true_makespan_delta":g["factual_makespan_second_minus_first"],
                  "pred_completed_delta":g["predicted_completed_second_minus_first"],
                  "prediction_completed": [
                      c["predicted_h20"]["completed"] for c in g["candidates"]],
                  "prediction_waiting": [
                      c["predicted_h20"]["waiting"] for c in g["candidates"]]},
                  ensure_ascii=False))
          print("PR42_ACTUAL_DIAGNOSTIC_EVIDENCE_VALIDATED")
          PY
          (cd "$RUNNER_TEMP/pr42" && sha256sum result.json run.log tests.log > SHA256SUMS)
          git rev-parse HEAD > "$RUNNER_TEMP/pr42/source_head.txt"
      - name: Save case-level source evidence and CPU logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr42-relational-identifiability-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pr42/result.json
            ${{ runner.temp }}/pr42/run.log
            ${{ runner.temp }}/pr42/tests.log
            ${{ runner.temp }}/pr42/SHA256SUMS
            ${{ runner.temp }}/pr42/source_head.txt
          retention-days: 90
          if-no-files-found: warn
