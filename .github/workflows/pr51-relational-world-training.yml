name: PR51 official PyG R-GCN decision-aware world-model training pilot
on:
  push:
    branches: [research/pr51-decision-aware-relational-labels-20261112]
    paths:
      - .github/workflows/pr51-relational-world-training.yml
      - experiments/world_model_integration/decision_learning_pr51/pr51_train.py
      - experiments/world_model_integration/decision_learning_pr51/pr51_train_protocol.json
      - experiments/world_model_integration/decision_learning_pr51/test_pr51_train.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  r-gcn-shared-transition-training:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: CPU model-training preflight with original PyTorch 2.5.1 and official PyG R-GCN
        run: |
          set -euo pipefail
          python -m pip install 'uv==0.13.5'
          uv pip install --system --python "$(command -v python)" --index-strategy unsafe-best-match -r requirements-paper-reuse.lock
          python -m pip install 'torch-geometric==2.6.1'
          python - <<'PY'
          import torch,torch_geometric
          from torch_geometric.nn import RGCNConv
          assert torch.version.cuda is None
          assert torch_geometric.__version__=="2.6.1"
          torch.set_num_threads(1)
          print("PR51_OFFICIAL_RELATIONAL_GCN_LIBRARY",torch_geometric.__version__,torch.__version__)
          PY
      - name: Download ORIGINAL PR51 factual candidate source and verify SHA256 and source HEAD
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr51train/source/congestion" \
            "$RUNNER_TEMP/pr51train/source/multi_fault" \
            "$RUNNER_TEMP/pr51train/source/staggered_arrivals"
          for entry in "congestion:13923077762" "multi_fault:13923706267" "staggered_arrivals:13923401729"; do
            REGIME="${entry%%:*}"
            ID="${entry##*:}"
            curl -fsSL --retry 3 \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/lieuyimo/wm/actions/artifacts/$ID/zip" \
              -o "$RUNNER_TEMP/pr51train/source/$REGIME.zip"
            unzip -q "$RUNNER_TEMP/pr51train/source/$REGIME.zip" \
              -d "$RUNNER_TEMP/pr51train/source/$REGIME"
            (cd "$RUNNER_TEMP/pr51train/source/$REGIME" && sha256sum -c SHA256SUMS)
            grep -Fx "86d9ab59e609f159a41b9434834a3a60e4f455dd" \
              "$RUNNER_TEMP/pr51train/source/$REGIME/source_head.txt"
          done
      - name: Physically separate train validation test BEFORE fitting and seal source splits
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          base=Path(os.environ["RUNNER_TEMP"])/"pr51train"
          split_dir=base/"split"
          split_dir.mkdir()
          grouped={"train":[],"validation":[],"test":[]}
          identities=set()
          seen=set()
          for reg in ("congestion","multi_fault","staggered_arrivals"):
              path=base/"source"/reg/"data.json"
              content=json.loads(path.read_text())
              identities.add(content["protocol_sha256"])
              assert content["regime"]==reg and len(content["cases"])==24
              for x in content["cases"]:
                  assert x["seed"] not in seen
                  seen.add(x["seed"])
                  grouped[x["split"]].append(x)
          assert len(identities)==1 and len(seen)==72
          assert [len(grouped[x]) for x in ("train","validation","test")]==[36,12,24]
          for split,rows in grouped.items():
              (split_dir/(split+".json")).write_text(json.dumps(rows,ensure_ascii=False,indent=2)+"\n")
          print("PR51_FROZEN_INDEPENDENT_SPLITS",[(k,len(v)) for k,v in grouped.items()])
          PY
      - name: PyG genuine action-conditioned R-GCN & decision-only gradient tests
        run: |
          set -euo pipefail
          python -m unittest experiments.world_model_integration.decision_learning_pr51.test_pr51_train -v \
            2>&1 | tee "$RUNNER_TEMP/pr51train/model-tests.log"
      - name: Train 4 prediction/decision/flat ablations and evaluate untouched test only AFTER selection
        run: |
          set -euo pipefail
          timeout 2000s python -m experiments.world_model_integration.decision_learning_pr51.pr51_train \
            --train "$RUNNER_TEMP/pr51train/split/train.json" \
            --validation "$RUNNER_TEMP/pr51train/split/validation.json" \
            --test "$RUNNER_TEMP/pr51train/split/test.json" \
            --out "$RUNNER_TEMP/pr51train/training" \
            2>&1 | tee "$RUNNER_TEMP/pr51train/train.log"
          python - <<'PY'
          import os,json
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"pr51train/training"
          x=json.loads((root/"result.json").read_text())
          s=json.loads((root/"selection.json").read_text())
          assert x["schema"]=="pr51-pilot-relational-decision-aware-trained-world-model-v1"
          assert x["models_trained"]==4 and x["model_selection_before_independent_test"]
          assert s["independent_test_was_not_opened"]
          assert not x["gpu_training_used"]
          assert len(list(root.glob("*.pt")))==4
          for arm in x["selection"]["all_validation"]:
              assert x["independent_test"][arm]["metrics"]["groups"]>0
          print("PR51_TRAINING_OUTPUT_VALIDATED",x["validation_chosen"])
          PY
          mkdir -p "$RUNNER_TEMP/pr51train/report"
          cp "$RUNNER_TEMP/pr51train/training/selection.json" "$RUNNER_TEMP/pr51train/report/"
          cp "$RUNNER_TEMP/pr51train/training/result.json" "$RUNNER_TEMP/pr51train/report/"
          cp "$RUNNER_TEMP/pr51train/model-tests.log" "$RUNNER_TEMP/pr51train/report/"
          cp "$RUNNER_TEMP/pr51train/train.log" "$RUNNER_TEMP/pr51train/report/"
          git rev-parse HEAD > "$RUNNER_TEMP/pr51train/report/source_head.txt"
          sha256sum requirements-paper-reuse.lock > "$RUNNER_TEMP/pr51train/report/dependency-lock.sha256"
          python -m pip freeze > "$RUNNER_TEMP/pr51train/report/pip-freeze.txt"
          (cd "$RUNNER_TEMP/pr51train/report" && sha256sum *.json *.log source_head.txt dependency-lock.sha256 pip-freeze.txt > SHA256SUMS)
      - name: Archive actual trained model weights, optimizer/RNG and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr51-trained-actual-relational-world-models-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pr51train/training/*.pt
            ${{ runner.temp }}/pr51train/report/
          retention-days: 90
          if-no-files-found: warn
