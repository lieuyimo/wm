name: PR77 actual relational world model with AGV and laboratory sample conveyor public graph CPU
on:
  push:
    branches: [research/pr77-relational-world-model-multidomain-contract-20261114]
    paths:
      - .github/workflows/pr77-relational-world-conveyor-contract-cpu.yml
      - world_model_core/**
      - business_transport/world_model/relational_gnn.py
      - business_transport/world_model/__init__.py
      - experiments/world_model_integration/multidomain_pr77/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  relational-world-domain-interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install original repository CPU dependencies
        run: |
          set -euo pipefail
          python -m pip install 'uv==0.13.5'
          uv pip install --system --python "$(command -v python)" --index-strategy unsafe-best-match -r requirements-paper-reuse.lock
          python -m pip install 'torch-geometric==2.6.1'
          python - <<'PY'
          import torch
          assert torch.version.cuda is None
          print("PR77_ORIGINAL_GNN_CPU_ONLY",torch.__version__)
          PY
      - name: Compile and test actual old PR61 GNN, original legal PR67 dynamics, and joint AGV/conveyor graph interface
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr77"
          python -m compileall -q world_model_core \
            business_transport/world_model/relational_gnn.py \
            experiments/world_model_integration/multidomain_pr77
          python -m unittest \
            experiments.world_model_integration.multidomain_pr77.test_pr77 \
            experiments.world_model_integration.neural_pr67.test_pr67 \
            experiments.world_model_integration.recovery_pr68.test_pr68 -v \
            2>&1 | tee "$RUNNER_TEMP/pr77/tests.log"
          python - <<'PY' | tee "$RUNNER_TEMP/pr77/contract.json"
          import json
          from world_model_core.contracts import LAB_READINESS, CONVEYOR_READINESS
          from experiments.world_model_integration.sealed_pr59.pr59_dual_model import (
              PublicMapTemporalRelationalWorld,parameter_count)
          model=PublicMapTemporalRelationalWorld(hidden=48,history_enabled=True,map_enabled=True)
          assert parameter_count(model)==52953
          assert LAB_READINESS.supports_trained_one_step_forecasting
          assert not LAB_READINESS.supports_verified_decision_rollout
          assert CONVEYOR_READINESS.public_graph_contract
          assert not CONVEYOR_READINESS.supports_trained_one_step_forecasting
          print(json.dumps({
              "pr61_original_GNN_parameters":parameter_count(model),
              "lab_pr61_one_step_research_only":True,
              "lab_factually_verified_H20_decision_value":False,
              "lab_sample_conveyor_public_graph_contract_valid":True,
              "conveyor_trained_inference_supported":False,
              "conveyor_physical_legality_verified":False,
              "actual_pr61_checkpoint_loaded":False,
              "test_only_untrained_graph_predictor_not_a_model_result":True,
              "GPU":False,
              "BLIND_TEST_read":False
          },sort_keys=True))
          PY
          git rev-parse HEAD > "$RUNNER_TEMP/pr77/source_head.txt"
          python -m pip freeze > "$RUNNER_TEMP/pr77/pip-freeze.txt"
          (cd "$RUNNER_TEMP/pr77" && sha256sum tests.log contract.json source_head.txt pip-freeze.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr77-original-relational-world-domain-contract-cpu-${{ github.run_id }}
          path: ${{ runner.temp }}/pr77/
          retention-days: 90
          if-no-files-found: warn
