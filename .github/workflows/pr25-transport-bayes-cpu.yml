name: PR25 transport Bayesian published library CPU

on:
  push:
    branches: [feature/transport-bayes-pgmpy-20261112]
    paths: [.github/workflows/pr25-transport-bayes-cpu.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-pgmpy-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.10"}
      - name: Install pinned CPU and upstream pgmpy
        run: |
          python -m pip install uv==0.13.5
          uv pip install --system --python "$(command -v python)" --index-strategy unsafe-best-match -r requirements-paper-reuse.lock
          uv pip install --system --python "$(command -v python)" -r requirements-rhwm-method-transfer.txt
          uv pip install --system --python "$(command -v python)" -r requirements-rhwm-transport-bayes.txt
          python - <<'PY'
          import pgmpy,torch
          assert pgmpy.__version__=="1.0.0"
          assert torch.version.cuda is None
          print("PGMPY_UPSTREAM_READY",pgmpy.__version__)
          PY
      - name: Run factual transport and Bayesian model unit tests
        run: |
          mkdir -p "$RUNNER_TEMP/pr25"
          timeout 150s python -m unittest discover -s experiments/world_model_integration/transport_events -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/pr25/tests.log"
      - name: Fit and independently test published pgmpy model
        run: |
          timeout 220s python -m experiments.world_model_integration.transport_events.evaluate_bayes --out "$RUNNER_TEMP/pr25/metrics.json" --trained "$RUNNER_TEMP/pr25/pgmpy-model.json" 2>&1 | tee "$RUNNER_TEMP/pr25/run.log"
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"pr25"
          r=json.loads((root/"metrics.json").read_text())
          s=r["summary"]
          assert s["splits"]["train"]["groups"]==24
          assert s["splits"]["validation"]["groups"]==8
          assert s["splits"]["holdout"]["groups"]==12
          assert s["train_positive"]>0 and s["train_positive"]<s["train_legs"]
          for b in s["splits"].values():
            assert set(b["brier"])=={"distance_no_delay","train_prevalence","pgmpy"}
          assert s["gpu"]==0
          print("PR25_EXTERNAL_PGMPY_EVALUATION_PASSED")
          PY
          (cd "$RUNNER_TEMP/pr25" && sha256sum metrics.json pgmpy-model.json tests.log run.log > evidence_sha256.txt)
      - name: Archive actual fitted model and original held-out metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr25-pgmpy-transport-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pr25/metrics.json
            ${{ runner.temp }}/pr25/pgmpy-model.json
            ${{ runner.temp }}/pr25/tests.log
            ${{ runner.temp }}/pr25/run.log
            ${{ runner.temp }}/pr25/evidence_sha256.txt
          retention-days: 90
          if-no-files-found: warn
