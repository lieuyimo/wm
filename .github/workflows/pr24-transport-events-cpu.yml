name: PR24 factual transport arrival and no-leakage baseline CPU

on:
  push:
    branches: [feature/transport-observable-events-20261112]
    paths: [.github/workflows/pr24-transport-events-cpu.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transport-facts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install uv==0.13.5
          uv pip install --system --python "$(command -v python)" --index-strategy unsafe-best-match -r requirements-paper-reuse.lock
          uv pip install --system --python "$(command -v python)" -r requirements-rhwm-method-transfer.txt
          python -c "import torch; assert torch.version.cuda is None"
      - name: Verify factual event contracts, original simulator invariance
        run: |
          mkdir -p "$RUNNER_TEMP/pr24"
          python -m unittest discover -s experiments/world_model_integration/transport_events -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/pr24/tests.log"
      - name: Run independent transport facts and geometry baseline
        run: |
          timeout 180s python -m experiments.world_model_integration.transport_events.benchmark --out "$RUNNER_TEMP/pr24/results.json" 2>&1 | tee "$RUNNER_TEMP/pr24/run.log"
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"pr24"
          r=json.loads((root/"results.json").read_text())
          s=r["summary"]
          assert {k:v["groups"] for k,v in s.items()}=={"train":24,"validation":8,"holdout":12}
          assert all(v["legs"]>0 for v in s.values())
          for group in r["groups"]:
            for row in group["rows"]:
              if not row["right_censored"]:
                assert row["start_tick"]<=row["arrived_tick"]<=row["service_admitted_tick"]
          print("PR24_FACTUAL_ARRIVAL_CONTRACT_PASSED",json.dumps(s))
          PY
          (cd "$RUNNER_TEMP/pr24" && sha256sum results.json run.log tests.log > evidence_sha256.txt)
      - name: Archive facts and tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr24-transport-factual-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pr24/results.json
            ${{ runner.temp }}/pr24/tests.log
            ${{ runner.temp }}/pr24/run.log
            ${{ runner.temp }}/pr24/evidence_sha256.txt
          retention-days: 90
          if-no-files-found: warn
