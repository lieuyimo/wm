name: PR75 original pretrained PR74 service Deep Sets lawful H5 H20 CPU gate
on:
  push:
    branches: [research/pr75-existing-deepsets-legal-public-arrival-h20-20261113]
    paths:
      - .github/workflows/pr75-original-trained-service-legal-h20-cpu.yml
      - experiments/world_model_integration/closedloop_pr75/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-trained-service-legal-world:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Reinstall immutable original CPU Python environment
        run: |
          set -euo pipefail
          python -m pip install 'uv==0.13.5'
          uv pip install --system --python "$(command -v python)" --index-strategy unsafe-best-match -r requirements-paper-reuse.lock
          python -m pip install 'torch-geometric==2.6.1'
          python - <<'PY'
          import torch
          assert torch.version.cuda is None
          print("PR75_REAL_TRAINED_MODEL_CPU_ONLY",torch.__version__)
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: 43264954353
          github-token: ${{ github.token }}
          name: pr64-real-random-outage-43264954353-train
          path: ${{ runner.temp }}/original-train
      - uses: actions/download-artifact@v4
        with:
          run-id: 43264954353
          github-token: ${{ github.token }}
          name: pr64-real-random-outage-43264954353-validation
          path: ${{ runner.temp }}/original-dev
      - uses: actions/download-artifact@v4
        with:
          run-id: 43264954353
          github-token: ${{ github.token }}
          name: pr64-shifted-outage-true-risk-set-audit-43264954353
          path: ${{ runner.temp }}/original-quality
      - uses: actions/download-artifact@v4
        with:
          run-id: 43452830808
          github-token: ${{ github.token }}
          name: pr74-actual-existing-deepsets-cpu-checkpoint-43452830808
          path: ${{ runner.temp }}/original-pr74-checkpoint
      - name: Admit exact existing pretrained model and original simulator data
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr75"
          (cd "$RUNNER_TEMP/original-train" && sha256sum -c SHA256SUMS)
          (cd "$RUNNER_TEMP/original-dev" && sha256sum -c SHA256SUMS)
          (cd "$RUNNER_TEMP/original-quality" && sha256sum -c SHA256SUMS)
          (cd "$RUNNER_TEMP/original-pr74-checkpoint" && sha256sum -c SHA256SUMS)
          ckpt="$RUNNER_TEMP/original-pr74-checkpoint/model/existing_deepsets_public_service_cpu_best.pt"
          test "$(sha256sum "$ckpt" | cut -d' ' -f1)" = a08b257c7f8b8a6191b954e9adb117ef8076f3ff93d5373c347d4735e1e45f02
          python -m compileall -q experiments/world_model_integration/closedloop_pr75
          python -m unittest \
            experiments.world_model_integration.closedloop_pr75.test_pr75 \
            experiments.world_model_integration.audit_pr71.test_pr71 \
            experiments.world_model_integration.service_pr74.test_pr74 -v \
            2>&1 | tee "$RUNNER_TEMP/pr75/tests.log"
      - name: Lawful original trained PR74 service model vs Rule H5/H20 with observed arrivals
        run: |
          set -euo pipefail
          python -m experiments.world_model_integration.closedloop_pr75.pr75_legal_h20 \
            --train "$RUNNER_TEMP/original-train/data.json" \
            --dev "$RUNNER_TEMP/original-dev/data.json" \
            --quality "$RUNNER_TEMP/original-quality/quality.json" \
            --checkpoint "$RUNNER_TEMP/original-pr74-checkpoint/model/existing_deepsets_public_service_cpu_best.pt" \
            --out "$RUNNER_TEMP/pr75/results.json" \
            2>&1 | tee "$RUNNER_TEMP/pr75/real-world.log"
          python - <<'PY'
          import os,json
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"pr75/results.json"
          obj=json.loads(p.read_text())
          assert obj["scenes"]==12
          assert len(obj["runs"])==144
          assert {row["arm"] for row in obj["runs"]}=={"rule","existing_deepsets"}
          assert all(row["full_horizon"] and row["all_business_states_legal"] for row in obj["runs"])
          assert sum(row["service_query_calls"] for row in obj["runs"] if row["arm"]=="existing_deepsets")>0
          assert all(obj["comparison"][str(h)]["n_independent_scenes"]==12 for h in (5,20))
          assert not obj["old_PR61_weights_used"] and not obj["original_BLIND_opened"]
          assert not obj["GPU_training"] and not obj["new_model_training"]
          print("PR75_ACTUAL_TRAINED_OFFLINE_SERVICE_H5_H20_RULE_WORLD_LEGAL_CPU_PASS")
          PY
          git rev-parse HEAD > "$RUNNER_TEMP/pr75/source_head.txt"
          python -m pip freeze > "$RUNNER_TEMP/pr75/pip-freeze.txt"
          (cd "$RUNNER_TEMP/pr75" && sha256sum results.json real-world.log tests.log source_head.txt pip-freeze.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr75-trained-pr74-service-world-legal-cpu-${{ github.run_id }}
          path: ${{ runner.temp }}/pr75/
          retention-days: 90
          if-no-files-found: warn
