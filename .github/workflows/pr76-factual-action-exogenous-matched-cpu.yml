name: PR76 original trained service world factual ACTION EXOGENOUS matched H5 H20 CPU
on:
  push:
    branches: [research/pr76-action-exogenous-matched-factual-world-h5-h20-20261113]
    paths:
      - .github/workflows/pr76-factual-action-exogenous-matched-cpu.yml
      - experiments/world_model_integration/matched_pr76/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-factual-matched-public-world:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install original CPU and Graph/Business dependencies without GPU
        run: |
          set -euo pipefail
          python -m pip install 'uv==0.13.5'
          uv pip install --system --python "$(command -v python)" --index-strategy unsafe-best-match -r requirements-paper-reuse.lock
          python -m pip install 'torch-geometric==2.6.1'
          python - <<'PY'
          import torch
          assert torch.version.cuda is None
          print("PR76_CPU_ONLY_ORIGINAL_MODEL",torch.__version__)
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: 43264954353
          github-token: ${{ github.token }}
          name: pr64-real-random-outage-43264954353-train
          path: ${{ runner.temp }}/original-train
      - uses: actions/download-artifact@v4
        with:
          run-id: 43264954353
          github-token: ${{ github.token }}
          name: pr64-real-random-outage-43264954353-validation
          path: ${{ runner.temp }}/original-dev
      - uses: actions/download-artifact@v4
        with:
          run-id: 43264954353
          github-token: ${{ github.token }}
          name: pr64-shifted-outage-true-risk-set-audit-43264954353
          path: ${{ runner.temp }}/original-quality
      - uses: actions/download-artifact@v4
        with:
          run-id: 43452830808
          github-token: ${{ github.token }}
          name: pr74-actual-existing-deepsets-cpu-checkpoint-43452830808
          path: ${{ runner.temp }}/original-pr74-checkpoint
      - name: Verify unchanged original PR64 physical source and real pretrained weights
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr76"
          (cd "$RUNNER_TEMP/original-train" && sha256sum -c SHA256SUMS)
          (cd "$RUNNER_TEMP/original-dev" && sha256sum -c SHA256SUMS)
          (cd "$RUNNER_TEMP/original-quality" && sha256sum -c SHA256SUMS)
          (cd "$RUNNER_TEMP/original-pr74-checkpoint" && sha256sum -c SHA256SUMS)
          ckpt="$RUNNER_TEMP/original-pr74-checkpoint/model/existing_deepsets_public_service_cpu_best.pt"
          test "$(sha256sum "$ckpt" | cut -d' ' -f1)" = a08b257c7f8b8a6191b954e9adb117ef8076f3ff93d5373c347d4735e1e45f02
          python -m compileall -q experiments/world_model_integration/matched_pr76
          python -m unittest \
            experiments.world_model_integration.matched_pr76.test_pr76 \
            experiments.world_model_integration.closedloop_pr75.test_pr75 \
            experiments.world_model_integration.service_pr74.test_pr74 \
            experiments.world_model_integration.synthesis_pr73.test_pr73 -v \
            2>&1 | tee "$RUNNER_TEMP/pr76/tests.log"
      - name: True factual action/device condition matched service model H5 H20
        run: |
          set -euo pipefail
          timeout 2300s python -m experiments.world_model_integration.matched_pr76.pr76_eval \
            --train "$RUNNER_TEMP/original-train/data.json" \
            --dev "$RUNNER_TEMP/original-dev/data.json" \
            --quality "$RUNNER_TEMP/original-quality/quality.json" \
            --checkpoint "$RUNNER_TEMP/original-pr74-checkpoint/model/existing_deepsets_public_service_cpu_best.pt" \
            --out "$RUNNER_TEMP/pr76/results.json" \
            2>&1 | tee "$RUNNER_TEMP/pr76/factual-matched.log"
          python - <<'PY'
          import os,json,math
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"pr76/results.json").read_text())
          assert r["original_developer_scenes"]==12
          assert r["original_train_scenes"]==24
          assert r["n_rollouts"]==432 and len(r["runs"])==432
          assert r["separate_ground_truth_reference"].startswith("original J2")
          assert not r["BLIND_TEST_read"] and not r["GPU_used"] and not r["new_training"]
          event=r["one_step_service_event_predictions"]
          assert event["n"]==1409 and event["event_count"]==594
          assert set(event["methods"])=={"rule","existing_deepsets","train_public_hazard"}
          assert all(0<=v["brier"]<=1 for v in event["methods"].values())
          assert all(x["legal_steps"]<=x["horizon"] for x in r["runs"])
          assert sum(x["full_horizon"] for x in r["runs"])<=432
          assert all(x["conditioned_device_boundaries"]==x["legal_steps"] for x in r["runs"])
          assert all(not x["stage2_future_truth_injected"] for x in r["runs"])
          for anchor in ("initial_t0","first_active_service"):
              for h in ("5","20"):
                  x=r["action_device_matched_H5_H20"][anchor][h]
                  assert x["attempted_matched_scene_seed_triples"]==36
                  assert x["fully_action_device_matched_triples"]<=36
                  assert all(v["attempts"]==36 for v in x["arm"].values())
          print("PR76_TRUE_FACTUAL_ACTION_DEVICE_MATCHED_FULL_DENOMINATOR_CPU_PASS")
          PY
          git rev-parse HEAD > "$RUNNER_TEMP/pr76/source_head.txt"
          python -m pip freeze > "$RUNNER_TEMP/pr76/pip-freeze.txt"
          (cd "$RUNNER_TEMP/pr76" && sha256sum results.json factual-matched.log tests.log source_head.txt pip-freeze.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr76-original-factual-action-exogenous-matched-${{ github.run_id }}
          path: ${{ runner.temp }}/pr76/
          retention-days: 90
          if-no-files-found: warn
