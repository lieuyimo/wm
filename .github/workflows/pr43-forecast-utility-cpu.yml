name: PR43 frozen H20 trajectory utility online CPU one-shot
on:
  push:
    branches: [research/pr43-forecast-utility-transfer-20261112]
    paths: [.github/workflows/pr43-forecast-utility-cpu.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-online-forecast-utility:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Restore PR31 pinned CPU dependencies
        run: |
          set -euo pipefail
          python -m pip install 'uv==0.13.5'
          uv pip install --system --python "$(command -v python)" --index-strategy unsafe-best-match -r requirements-paper-reuse.lock
          python - <<'PY'
          import torch
          assert torch.version.cuda is None, "PR43 GPU forbidden"
          torch.set_num_threads(1)
          print("PR43_CPU_TORCH", torch.__version__)
          PY
      - name: Restore only original immutable V4 checkpoint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr43"
          curl -fsSL --retry 3 -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/lieuyimo/wm/actions/artifacts/13765135588/zip \
            -o "$RUNNER_TEMP/pr43/original-v4.zip"
          unzip -p "$RUNNER_TEMP/pr43/original-v4.zip" v4-data.pt > "$RUNNER_TEMP/pr43/v4-data.pt"
          echo "60c8a6c3d832da3e6519072688ea099f64ae120ba19d3bd2ec705f7f1a11ac0c  $RUNNER_TEMP/pr43/v4-data.pt" | sha256sum -c
          echo "PR43_V4=$RUNNER_TEMP/pr43/v4-data.pt" >> "$GITHUB_ENV"
      - name: Unit tests and exact immutable comparator contract
        run: |
          set -euo pipefail
          python -m compileall -q experiments/world_model_integration/forecast_utility
          python -m unittest experiments.world_model_integration.forecast_utility.test_pr43 -v \
            2>&1 | tee "$RUNNER_TEMP/pr43/tests.log"
      - name: Run 24 new independent full online scenarios on CPU
        run: |
          set -euo pipefail
          timeout 800s python -m experiments.world_model_integration.forecast_utility.pr43_online \
            --checkpoint "$PR43_V4" --out "$RUNNER_TEMP/pr43/results.json" \
            2>&1 | tee "$RUNNER_TEMP/pr43/run.log"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"pr43/results.json"
          r=json.loads(p.read_text())
          assert r["evidence_scope"]=="one-shot_new_synthetic_independent_full_online"
          assert r["summary"]["groups"]==24 and r["gpu"]==0 and r["training"]==0
          assert len({g["seed"] for g in r["groups"]})==24
          assert all(a["safety_violations"]==0 for g in r["groups"] for a in g["arms"].values())
          assert all(r["summary"]["by_regime"][k]["groups"]==6 for k in ("light","medium","heavy","shift"))
          for regime, group in r["summary"]["by_regime"].items():
              print("PR43_REGIME",regime,json.dumps(group,ensure_ascii=False))
          print("PR43_INDEPENDENT_ONLINE_COMPLETE")
          PY
          git rev-parse HEAD > "$RUNNER_TEMP/pr43/source_head.txt"
          (cd "$RUNNER_TEMP/pr43" && sha256sum results.json run.log tests.log source_head.txt > SHA256SUMS)
      - name: Upload exact independent scenario-level evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr43-forecast-utility-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pr43/results.json
            ${{ runner.temp }}/pr43/tests.log
            ${{ runner.temp }}/pr43/run.log
            ${{ runner.temp }}/pr43/source_head.txt
            ${{ runner.temp }}/pr43/SHA256SUMS
          retention-days: 90
          if-no-files-found: warn
