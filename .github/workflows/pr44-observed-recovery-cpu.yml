name: PR44 public station recovery survival CPU research
on:
  push:
    branches: [research/pr44-observable-recovery-dynamics-20261112]
    paths:
      - .github/workflows/pr44-observed-recovery-cpu.yml
      - experiments/world_model_integration/health_recovery/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-recovery-reliability:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Original pinned CPU environment
        run: |
          set -euo pipefail
          python -m pip install 'uv==0.13.5'
          uv pip install --system --python "$(command -v python)" --index-strategy unsafe-best-match -r requirements-paper-reuse.lock
          python - <<'PY'
          import torch
          assert torch.version.cuda is None
          print("PR44 CPU locked:",torch.__version__)
          PY
      - name: Public observation, censoring and frozen cohort contract tests
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr44"
          python -m compileall -q experiments/world_model_integration/health_recovery
          python -m unittest experiments.world_model_integration.health_recovery.test_pr44 -v \
            2>&1 | tee "$RUNNER_TEMP/pr44/tests.log"
      - name: Run 36 training + 24 held-out original BusinessSimulator scenarios
        run: |
          set -euo pipefail
          timeout 450s python -m experiments.world_model_integration.health_recovery.pr44_observed_recovery \
            --out "$RUNNER_TEMP/pr44/result.json" \
            2>&1 | tee "$RUNNER_TEMP/pr44/run.log"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"pr44/result.json"
          r=json.loads(p.read_text())
          assert r["scope"]=="predeclared_synthetic_existing_simulator_observed_recovery_only"
          assert r["train_episodes"]==36 and r["heldout_episodes"]==24
          assert r["gpu"]==0 and r["new_neural_training"]==0 and r["network_inference"]==0
          assert r["no_fault_oracle_model_features"]
          assert all(c["safety_violations"]==0 for c in r["heldout_scored"])
          assert len(r["public_status_streams"]["train"])==36
          assert len(r["public_status_streams"]["heldout"])==24
          assert all(c["prediction_label_pairs"] for c in r["heldout_scored"])
          assert all(set(rec)=={"tick","device_available","service_admission_available","capacity_blocked"}
                     for group in r["public_status_streams"].values()
                     for ep in group for rec in ep["public_device_status"])
          assert "outage_schedule" not in p.read_text()
          for h,s in r["summary"].items():
              print("PR44_HELDOUT",h,json.dumps(s,ensure_ascii=False))
          print("PR44_EVIDENCE_CHECK_PASSED")
          PY
          git rev-parse HEAD > "$RUNNER_TEMP/pr44/source_head.txt"
          sha256sum requirements-paper-reuse.lock > "$RUNNER_TEMP/pr44/dependency-lock.sha256"
          python -m pip freeze > "$RUNNER_TEMP/pr44/pip-freeze.txt"
          (cd "$RUNNER_TEMP/pr44" && sha256sum result.json tests.log run.log source_head.txt dependency-lock.sha256 pip-freeze.txt > SHA256SUMS)
      - name: Upload full public-recovery source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr44-observable-recovery-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pr44/result.json
            ${{ runner.temp }}/pr44/tests.log
            ${{ runner.temp }}/pr44/run.log
            ${{ runner.temp }}/pr44/source_head.txt
            ${{ runner.temp }}/pr44/SHA256SUMS
            ${{ runner.temp }}/pr44/dependency-lock.sha256
            ${{ runner.temp }}/pr44/pip-freeze.txt
          retention-days: 90
          if-no-files-found: warn
