name: PR74 original Deep Sets conditional service event CPU training smoke
on:
  push:
    branches: [research/pr74-existing-deepsets-service-cpu-smoke-20261113]
    paths:
      - .github/workflows/pr74-existing-deepsets-service-cpu-train.yml
      - experiments/world_model_integration/service_pr74/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  existing-service-model-training:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Use original paper-reuse lock on CPU
        run: |
          set -euo pipefail
          python -m pip install 'uv==0.13.5'
          uv pip install --system --python "$(command -v python)" --index-strategy unsafe-best-match -r requirements-paper-reuse.lock
          python -m pip install 'torch-geometric==2.6.1'
          python - <<'PY'
          import torch
          assert torch.version.cuda is None
          print("PR74_ACTUAL_CPU_ORIGINAL_MODEL",torch.__version__)
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: 43264954353
          github-token: ${{ github.token }}
          name: pr64-real-random-outage-43264954353-train
          path: ${{ runner.temp }}/original-train
      - uses: actions/download-artifact@v4
        with:
          run-id: 43264954353
          github-token: ${{ github.token }}
          name: pr64-real-random-outage-43264954353-validation
          path: ${{ runner.temp }}/original-dev
      - uses: actions/download-artifact@v4
        with:
          run-id: 43264954353
          github-token: ${{ github.token }}
          name: pr64-shifted-outage-true-risk-set-audit-43264954353
          path: ${{ runner.temp }}/original-quality
      - name: Lock the true physical simulator source and test original model contract
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr74"
          (cd "$RUNNER_TEMP/original-train" && sha256sum -c SHA256SUMS)
          (cd "$RUNNER_TEMP/original-dev" && sha256sum -c SHA256SUMS)
          (cd "$RUNNER_TEMP/original-quality" && sha256sum -c SHA256SUMS)
          python -m compileall -q experiments/world_model_integration/service_pr74
          python -m unittest \
            experiments.world_model_integration.service_pr74.test_pr74 \
            experiments.world_model_integration.synthesis_pr73.test_pr73 -v \
            2>&1 | tee "$RUNNER_TEMP/pr74/tests.log"
      - name: Generate factual public query events and TRAIN the ORIGINAL existing Deep Sets service model
        run: |
          set -euo pipefail
          python -m experiments.world_model_integration.service_pr74.pr74_cpu_training \
            --train "$RUNNER_TEMP/original-train/data.json" \
            --dev "$RUNNER_TEMP/original-dev/data.json" \
            --quality "$RUNNER_TEMP/original-quality/quality.json" \
            --output-dir "$RUNNER_TEMP/pr74/model" \
            2>&1 | tee "$RUNNER_TEMP/pr74/training.log"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"pr74/model"
          d=json.loads((p/"result.json").read_text())
          assert d["sample_splits"]["distinct_train_scenes"]==24
          assert d["sample_splits"]["distinct_dev_scenes"]==12
          assert d["sample_splits"]["train_risk_rows"]==2593
          assert d["sample_splits"]["dev_risk_rows"]==1409
          assert d["existing_model_class"]=="lab_transport.business_session_learning.BusinessSessionEventModel"
          assert not d["old_PR61_checkpoint_loaded"] and not d["new_architecture_invented"]
          assert d["offline_only"] and not d["BLIND_TEST_read"] and d["no_gpu"]
          assert (p/"existing_deepsets_public_service_cpu_best.pt").exists()
          print("PR74_ACTUAL_ORIGINAL_DEEPSETS_CPU_CHECKPOINT_AND_DEV_SCORES_PASS")
          PY
          git rev-parse HEAD > "$RUNNER_TEMP/pr74/source_head.txt"
          python -m pip freeze > "$RUNNER_TEMP/pr74/pip-freeze.txt"
          (cd "$RUNNER_TEMP/pr74" && sha256sum tests.log training.log source_head.txt pip-freeze.txt model/* > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr74-actual-existing-deepsets-cpu-checkpoint-${{ github.run_id }}
          path: ${{ runner.temp }}/pr74/
          retention-days: 90
          if-no-files-found: warn
