name: PR78 verified original PR61 six-arm frozen GNN service event head CPU training
on:
  workflow_dispatch:
    inputs:
      original_archive_artifact_run_id:
        description: "Existing Actions run containing original PR61 exact SHA-verified tar.gz (must already be stored with consent)"
        required: true
        type: string
      original_archive_artifact_name:
        description: "Existing artifact name containing pr60-gpu-checkpoints-20261112.tar.gz"
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  original-six-head-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install frozen CPU-only original PR61 PyG training environment
        run: |
          set -euo pipefail
          python -m pip install 'uv==0.13.5'
          uv pip install --system --python "$(command -v python)" --index-strategy unsafe-best-match -r requirements-paper-reuse.lock
          python -m pip install 'torch-geometric==2.6.1'
          python - <<'PY'
          import torch
          assert torch.version.cuda is None
          print("PR78_ORIGINAL_GNN_HEAD_CPU_ONLY",torch.__version__)
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: 43264954353
          github-token: ${{ github.token }}
          name: pr64-real-random-outage-43264954353-train
          path: ${{ runner.temp }}/original-train
      - uses: actions/download-artifact@v4
        with:
          run-id: 43264954353
          github-token: ${{ github.token }}
          name: pr64-real-random-outage-43264954353-validation
          path: ${{ runner.temp }}/original-dev
      - uses: actions/download-artifact@v4
        with:
          run-id: 43264954353
          github-token: ${{ github.token }}
          name: pr64-shifted-outage-true-risk-set-audit-43264954353
          path: ${{ runner.temp }}/original-quality
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.original_archive_artifact_run_id }}
          github-token: ${{ github.token }}
          name: ${{ inputs.original_archive_artifact_name }}
          path: ${{ runner.temp }}/trusted-original-pr61
      - name: Verify original data SHA and sealed 6-checkpoint SHA before CPU training
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/original-train" && sha256sum -c SHA256SUMS)
          (cd "$RUNNER_TEMP/original-dev" && sha256sum -c SHA256SUMS)
          (cd "$RUNNER_TEMP/original-quality" && sha256sum -c SHA256SUMS)
          mapfile -d '' archives < <(find "$RUNNER_TEMP/trusted-original-pr61" -type f \
            -name 'pr60-gpu-checkpoints-20261112.tar.gz' -print0)
          if [[ "${#archives[@]}" != 1 ]]; then
            echo "BLOCKED_ORIGINAL_PR61_ARCHIVE_NOT_PRESENT_OR_AMBIGUOUS" >&2
            exit 1
          fi
          original_archive="${archives[0]}"
          echo "ORIGINAL_PR61_ARCHIVE=$original_archive" >> "$GITHUB_ENV"
          echo "919a0b625659e492811a74bc5cdf76a60ccbf639acb32c33a420b7db30a74e14  $original_archive" | sha256sum -c -
          test "$(stat -c%s "$original_archive")" = 6661520
          python -m unittest \
            experiments.world_model_integration.gnn_pr78.test_pr78 \
            experiments.world_model_integration.gnn_pr78.test_pr78_frozen_cache -v
          python -m experiments.world_model_integration.recovery_pr68.pr68_checkpoint \
            --archive "$original_archive" \
            --manifest examples/evidence/pr60-gpu-training-20261112/checkpoint_manifest.csv \
            --out "$RUNNER_TEMP/pr78-original-pr61-admission.json"
      - name: Train the six REAL pretrained PR61 frozen graph + 48d public service heads on CPU
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr78-training"
          python -m experiments.world_model_integration.gnn_pr78.pr78_pretrained_train \
            --original-pr61-archive "$ORIGINAL_PR61_ARCHIVE" \
            --original-pr61-manifest examples/evidence/pr60-gpu-training-20261112/checkpoint_manifest.csv \
            --train "$RUNNER_TEMP/original-train/data.json" \
            --dev "$RUNNER_TEMP/original-dev/data.json" \
            --quality "$RUNNER_TEMP/original-quality/quality.json" \
            --device cpu \
            --output-dir "$RUNNER_TEMP/pr78-training/six-original-heads" \
            2>&1 | tee "$RUNNER_TEMP/pr78-training/training.log"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"pr78-training"
          d=json.loads((root/"six-original-heads"/"report.json").read_text())
          assert d["original_PR61_backbone_all_six_frozen_and_SHA_admitted"]
          assert d["train_service_risk_count"]==2593 and d["dev_service_risk_count"]==1409
          assert len(d["model_seed_arms"])==6
          assert all(x["original_PR61_backbone_frozen"] for x in d["model_seed_arms"])
          assert not d["BLIND_TEST_read"] and not d["online_verified"]
          print("PR78_ACTUAL_SIX_PR61_PRETRAINED_CPU_EVENT_HEADS_FINISHED")
          PY
          git rev-parse HEAD > "$RUNNER_TEMP/pr78-training/source_head.txt"
          (cd "$RUNNER_TEMP/pr78-training" && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr78-pretrained-original-GNN-six-head-CPU-${{ github.run_id }}
          path: ${{ runner.temp }}/pr78-training/
          retention-days: 90
          if-no-files-found: warn
